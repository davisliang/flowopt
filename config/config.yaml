# Defaults for every run. Override a field on the command line with a dotted path
# (`flowopt --task gsm8k designer.rounds=1 runtime.concurrency=4`), or
# from a task file under config/task/.

# The models the optimizer may use: OpenRouter ids (any model on
# https://openrouter.ai/models works — all calls go through OpenRouter, so
# OPENROUTER_API_KEY is the one key a run needs). Prices come from OpenRouter
# and capability / speed measurements from Artificial Analysis (set
# ARTIFICIAL_ANALYSIS_API_KEY to enable), so this list is only WHICH models —
# nothing here to drift out of sync. The catalog sorts them cheapest first.
models:
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-v4-pro
  - moonshotai/kimi-k3
  - z-ai/glm-5.2
  - meta/muse-spark-1.1
  - openai/gpt-5.6-luna
  - openai/gpt-5.6-luna-pro
  - openai/gpt-5.6-terra
  - openai/gpt-5.6-terra-pro
  - openai/gpt-5.6-sol
  - openai/gpt-5.6-sol-pro
  - anthropic/claude-opus-5
  - anthropic/claude-sonnet-5
  - google/gemini-3.1-pro-preview
  - google/gemini-3.5-flash
  - google/gemini-3.6-flash
  - google/gemini-3.5-flash-lite

# The model that analyzes the task and generates the dataset.
analysis_model: anthropic/claude-opus-4.8

# One model call.
call:
  # One output ceiling for every call, set high enough to never be the reason an
  # answer is short. NOT a cost knob — you pay for the tokens a reply actually
  # uses. It has to be generous because THINKING COUNTS AGAINST IT: at
  # effort="max" a 16k ceiling was measured burning the whole budget on thinking
  # and returning an empty answer.
  max_output_tokens: 64000
  # Fallback prompt-cache multipliers on the input rate, used only for models
  # OpenRouter lists no cache price for: a write costs a bit more once, a read
  # is ~90% off.
  cache_write_multiplier: 1.25
  cache_read_multiplier: 0.10
  # OpenRouter request plugins applied to every call (not model-callable tools —
  # each runs once per request): response-healing repairs malformed JSON output,
  # context-compression truncates middle-out when a prompt exceeds the context.
  # Both off by default: healing can mask a broken workflow, compression can
  # silently drop the part of the prompt that mattered.
  plugins: []

# The per-query budget a candidate workflow runs under. (Candidates always run
# with a restricted import list — see compile_solve in
# src/flowopt/runtime.py.)
runtime:
  max_model_calls: 24      # model calls one query may make
  max_tokens: 120000       # tokens one query may spend
  concurrency: 8           # examples scored at once (API latency dominates)
  # Server-side tools a workflow may call (OpenRouter server tools). Drop one to
  # forbid it; set to [] for a closed-book task, so no candidate can reach the
  # web. "subagent" (in-call delegation to a worker model) exists too but stays
  # off by default — workflows already delegate by routing call_model. (There is
  # no code_execution — OpenRouter runs no code server-side.)
  tools: [web_search, web_fetch]

# Grading free-form answers (check_type: llm_judge).
judge:
  model: anthropic/claude-haiku-4.5
  # The bar a task-specific rubric must clear to be used at all: scored under it
  # an ideal answer must reach min_gold_score, an empty answer must stay under
  # max_empty_score. A rubric failing either is dropped for the generic judge.
  min_gold_score: 0.7
  max_empty_score: 0.5

# Generating a dataset when the task supplies none.
data:
  n_examples: 100
  dev_fraction: 0.6        # dev guides the search; the rest is held-out test
  n_case_types: 15         # kinds of case planned up front, to spread batches over
  batch_size: 20           # examples per generation call (one giant call truncates)
  free_form_batch_size: 5  # free-form answers are long, so smaller batches
  max_stalls: 3            # give up after this many batches add nothing new

# The design agent. Any OpenRouter model id — the agent session runs through
# OpenRouter's Anthropic-compatible endpoint, so the designer is selectable too.
designer:
  model: anthropic/claude-opus-4.8
  rounds: 3                # design rounds; each one costs real money
  research: true           # web-research phase before designing, writing research_notes.md
  # Research reads the web and writes a briefing; the designer reads only the
  # briefing. A cheap model does the reading — running it on the designer model
  # was observed burning ~$100 on one session before the caps below existed.
  research_model: openai/gpt-5.6-luna
  # Hard caps on agent turns per session: each turn re-bills a growing context,
  # so uncapped sessions are uncapped bills. Research is a focused reading pass;
  # design rounds need more room for write -> self-test -> revise loops.
  research_max_turns: 40
  max_turns: 120
  working_skills: false    # give the agent a working_skills/ dir it reads+writes across a run's rounds
  dev_sample_size: 5       # dev examples the agent may self-test against
  # Worst dev examples surfaced per candidate to the next round. 0 keeps dev
  # aggregate-only (the agent sees % correct and cost, never dev questions or
  # golds — it diagnoses on the train split via the eval skill); raise it to
  # trade a dev leak for direct failure signal.
  failures_shown: 0
  dominated_shown: 10      # off-frontier candidates shown besides the full frontier (most recent kept)
  skills: [workflow-design, workflow-eval, workflow-naming]
  allowed_tools: [WebSearch, WebFetch, Bash, Read, Write, Skill]

# The two convenience picks, and where results land.
report:
  max_cost_per_query: 0.002  # "the best workflow I can afford"
  min_accuracy: 0.80         # "the cheapest workflow that is good enough"
  output_dir: runs
