[project]
name = "flowopt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.120",
    "matplotlib>=3.11.0",
    "omegaconf>=2.3.0",
    "openai>=2.0.0",
    "pydantic>=2.0",
]

[project.scripts]
flowopt = "flowopt.cli:main"
flowopt-ui = "flowopt.dashboard.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowopt"]
artifacts = ["src/flowopt/dashboard/static/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
