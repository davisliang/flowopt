# simpleqa — full set, imported by scripts/pull_full_benchmarks.py.
# Replaces the routerllm sample; routerllm's partition and baselines are gone
# (they were measured on that sample and don't transfer to these splits).
name: simpleqa
description: >-
  Answer a SimpleQA short-form factual question. The answer is a brief fact — a name, date, or number — correct if it matches the reference.
source_dataset: google/simpleqa-verified
num_fewshot: 0
examples: 1000
sampled_from: 1000
grader_label: judge
grading_supported: true
# Split into equal thirds with a seeded shuffle (seed 0); size the run's
# train/dev/test draws from these partitions when starting a search.
split_labeled: 333 train / 333 val / 334 test
check_type: llm_judge
