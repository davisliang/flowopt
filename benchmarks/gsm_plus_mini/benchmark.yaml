# gsm_plus_mini — full set, imported by scripts/pull_full_benchmarks.py.
# Replaces the routerllm sample; routerllm's partition and baselines are gone
# (they were measured on that sample and don't transfer to these splits).
name: gsm_plus_mini
description: >-
  Solve a GSM-Plus grade-school maths word problem, including adversarial perturbations of the original GSM8K wording. The answer is a single number.
source_dataset: qintongli/GSM-Plus
num_fewshot: 0
examples: 2400
sampled_from: 2400
grader_label: exact
grading_supported: true
# Split into equal thirds with a seeded shuffle (seed 0); size the run's
# train/dev/test draws from these partitions when starting a search.
split_labeled: 800 train / 800 val / 800 test
check_type: exact
