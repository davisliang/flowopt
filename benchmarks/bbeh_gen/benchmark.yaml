# bbeh_gen — full set, imported by scripts/pull_full_benchmarks.py.
# Replaces the routerllm sample; routerllm's partition and baselines are gone
# (they were measured on that sample and don't transfer to these splits).
name: bbeh_gen
description: >-
  Answer a BIG-Bench Extra Hard reasoning question. The answer is a short exact string — a word, number, or label — matched exactly.
source_dataset: jgyasu/bbeh
num_fewshot: 0
examples: 4520
sampled_from: 4520
grader_label: exact
grading_supported: true
# Split into equal thirds with a seeded shuffle (seed 0); size the run's
# train/dev/test draws from these partitions when starting a search.
split_labeled: 1506 train / 1506 val / 1508 test
check_type: exact
