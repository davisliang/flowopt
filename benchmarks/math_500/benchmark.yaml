# math_500 — imported by scripts/import_math500.py from HuggingFaceH4/MATH-500.
# Graded with the binary equality checker (check_type: llm_equality), matching
# how Artificial Analysis scores it; accuracy is percentage correct.
name: math_500
description: >-
  Solve a MATH-500 competition mathematics problem. The answer is an exact value — an integer, fraction, or expression; an answer is correct only if it is mathematically equal to the reference.
source_dataset: HuggingFaceH4/MATH-500
num_fewshot: 0
examples: 500
sampled_from: 500
grader_label: equality (official HLE checker)
grading_supported: true
# Full AA question set graded with AA's own protocol (equality checker on
# GPT-4o Aug) — scores are comparable to Artificial Analysis's numbers.
aa_validated: true
# Split into equal thirds with a seeded shuffle (seed 0); no external
# allocation or baselines apply to these splits.
split_labeled: 166 train / 166 val / 168 test
check_type: llm_equality
