# ifeval — full set, imported by scripts/pull_full_benchmarks.py.
# Replaces the routerllm sample; routerllm's partition and baselines are gone
# (they were measured on that sample and don't transfer to these splits).
name: ifeval
description: >-
  Follow the instructions in the prompt exactly. Each prompt states one or more verifiable formatting constraints. An answer is correct ONLY if it satisfies EVERY constraint; content quality is not judged, only compliance. The constraints are stated in the prompt, so a response can be checked against them before being returned.
source_dataset: google/IFEval
num_fewshot: 0
examples: 541
sampled_from: 541
grader_label: native
grading_supported: true
# Split into equal thirds with a seeded shuffle (seed 0); size the run's
# train/dev/test draws from these partitions when starting a search.
split_labeled: 180 train / 180 val / 181 test
check_type: exact
