# aa_omniscience — full set, imported by scripts/pull_full_benchmarks.py.
# Replaces the routerllm sample; routerllm's partition and baselines are gone
# (they were measured on that sample and don't transfer to these splits).
name: aa_omniscience
description: >-
  Answer a short factual question from the AA-Omniscience set. Answers are brief factual statements; an answer is correct if it states the same fact as the reference, in any wording.
source_dataset: ArtificialAnalysis/AA-Omniscience-Public
num_fewshot: 0
examples: 600
sampled_from: 600
grader_label: judge
grading_supported: true
# Split into equal thirds with a seeded shuffle (seed 0); size the run's
# train/dev/test draws from these partitions when starting a search.
split_labeled: 200 train / 200 val / 200 test
check_type: llm_equality
