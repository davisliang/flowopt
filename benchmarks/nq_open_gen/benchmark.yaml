# nq_open_gen — full set, imported by scripts/pull_full_benchmarks.py.
# Replaces the routerllm sample; routerllm's partition and baselines are gone
# (they were measured on that sample and don't transfer to these splits).
name: nq_open_gen
description: >-
  Answer an open-domain Natural Questions query. The answer is a short factual span; several phrasings are accepted.
source_dataset: google-research-datasets/nq_open
num_fewshot: 0
examples: 3610
sampled_from: 3610
grader_label: contains
grading_supported: true
# Split into equal thirds with a seeded shuffle (seed 0); size the run's
# train/dev/test draws from these partitions when starting a search.
split_labeled: 1203 train / 1203 val / 1204 test
check_type: exact
